name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Exact patch pinned in docs/DEPENDENCIES.md — keep in lockstep, do not float to "22" or "lts/*".
          node-version: "22.23.2"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # TODO: add rules test job once functions/ exists — see 06-TESTING.md

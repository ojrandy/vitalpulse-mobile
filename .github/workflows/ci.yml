name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, test (app)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Exact patch pinned in docs/DEPENDENCIES.md — keep in lockstep, do not float to "22" or "lts/*".
          node-version: "22.23.2"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci)
        # Installs the app, functions/, and packages/shared-schemas together
        # (npm workspaces) — one lockfile, one install, per docs/DEPENDENCIES.md.
        run: npm ci

      - name: Lint (app)
        run: npm run lint

      - name: Typecheck (app)
        run: npm run typecheck

      - name: Test (app)
        run: npm run test

  functions:
    name: Lint, typecheck, test (Cloud Functions)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Lint (functions)
        run: npm run lint --workspace=functions

      - name: Typecheck (functions)
        run: npm run typecheck --workspace=functions

      - name: Test (functions)
        run: npm run test --workspace=functions

      - name: Build (functions)
        run: npm run build --workspace=functions

  rules-test:
    name: Firestore rules test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Set up Java (required by the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install firebase-tools
        # Pinned in docs/DEPENDENCIES.md — keep in lockstep.
        run: npm install -g firebase-tools@15.30.1

      - name: Run Firestore rules test suite against the emulator
        # No real Firebase project exists yet (docs/PROJECTTRACKER.md task 2)
        # — a "demo-" prefixed project ID runs the emulator standalone, no
        # login/billing required. See docs/06-TESTING.md §2.
        run: firebase emulators:exec --project=demo-vitalpulse-ci --only firestore "npm run test:rules"
